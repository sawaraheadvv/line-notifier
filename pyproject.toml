[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "line-notifier"
version = "1.0.0"
description = "LINE Messaging API でテキストメッセージを送る共通ライブラリ"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["requests>=2.20"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["line_notifier"]
